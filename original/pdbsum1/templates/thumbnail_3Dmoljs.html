<!-- Determine whether we have any C-alpha-only chains or if structure
     too large to display in 3dmol.js -->
<FLD%>_COUNTER1=0</FLD%>
<LOOP NUNIQ>
<SKIP !CALPHA_ONLY>
<FLD%>_COUNTER1++</FLD%>
</SKIP !CALPHA_ONLY>
</LOOP NUNIQ>
<BLOCK LARGE>
<FLD%>_COUNTER1++</FLD%>
</BLOCK LARGE>

<!-- Table containing thumbnail image, plus buttons for 3D viewers -->
<table bgcolor="white" border=0 cellpadding=0 cellspacing=0>
 <tr>
<BLOCK SIDE_LINE>
  <td bgcolor="<FLD%>TAGS_COLOUR</FLD%>" width=1>
   <img src="gif/1x1.gif" width=1>
  </td>
</BLOCK SIDE_LINE>
  <td align=center width=240 height=240>

<SKIP COUNTER1[gt0]>
   <div id="gldiv" class="thumbnail_window">
     <P>&nbsp;<P>&nbsp;<P>&nbsp;<P>&nbsp;<P>
       <font size=+1>Loading ...</font>
   </div>
</SKIP COUNTER1[gt0]>
<SKIP COUNTER1[eq0]>
   <img width=220 height=220 src="tmpgif/traces.jpg">
</SKIP COUNTER1[eq0]>

  </td>
 </tr>

 <!-- Gap -->
 <tr>
<BLOCK SIDE_LINE>
  <td bgcolor="<FLD%>TAGS_COLOUR</FLD%>" width=1>
   <img src="gif/1x1.gif" width=1>
  </td>
</BLOCK SIDE_LINE>
  <td>
   <img width=1 height=10 src="gif/1x1.gif">
  </td>
 </tr>

  <td bgcolor="<FLD%>TAGS_COLOUR</FLD%>" width=1>

</BLOCK SIDE_LINE>
<SKIP COUNTER1[gt0]>
  <td colspan=3 align=center>
   <table bgcolor="white" border=0 cellpadding=2 cellspacing=0>
